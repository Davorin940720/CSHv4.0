arch:
  - aarch64
  - amd64
description:
  Private Self-hosted collection of powerful web-based tools for tasks.
  No ads, no tracking, just fast, accessible utilities right from your browser
  Created by and for Cawood Systems by Davorin Cawood
image: ghcr.io/alexbelgium/omni-tools-{arch}
init: false
map:
  - app_config:rw
name: Omni Tools
options:
  env_vars: []
ports:
  80/tcp: 8188
ports_description:
  80/tcp: Web UI port
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
slug: cawood_omni-tools
url: https://github.com/Davorin940720/CSHv4.0/tree/Cawood_Omni-Tools
version: 0.6.1.2
webui: "[PROTO:ssl]://[HOST]:[PORT:80]"
